# Adapted from https://forum.typst.app/t/publish-example-pdfs-using-github-pages/5781
name: Publish

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.14.2

      - name: Build
        run: python compile.py github-pages-build

      - name: Upload site files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: github-pages-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
